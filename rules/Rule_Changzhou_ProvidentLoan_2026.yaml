rule_id: Rule_Changzhou_ProvidentLoan_2026
name: 常州公积金可贷额度与人才多孩支持
version: '1.0'
description: 常州官方依据的金额试算；说明金额性质和适用时间，不默认资格和账户事实，实际以主管部门审核/银行合同为准。
region: 江苏省常州市
keywords:
- 公积金贷款
- 贷款额度
- 可贷额度
- 能贷多少
- 硕士公积金
- 博士公积金
- 多孩贷款
- 绿色建筑
- 能贷
- 公积金额度
- 可贷
