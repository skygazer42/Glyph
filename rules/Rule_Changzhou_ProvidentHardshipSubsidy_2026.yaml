rule_id: Rule_Changzhou_ProvidentHardshipSubsidy_2026
name: 常州困难家庭公积金贷款年度贴息
version: '1.0'
description: 按上年度实际支付的合规公积金贷款利息试算；非申即享，试算不代表困难资格认定、联合审核或到账。
