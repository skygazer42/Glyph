valid_period:
  start: '2026-01-01'
  end: '2026-12-31'
inputs:
- name: price_ex_vat
  label: 车身不含税价
  type: float
  required: true
  description: 元。境内购买自用车辆发票载明的不含增值税价，不要填写价税合计。换电车分别核算并单独开票时填不含电池车身不含税价
- name: purchase_date
  label: 购置凭证日期
  type: string
  required: true
  description: YYYY-MM-DD，机动车销售统一发票或有效购置凭证的开具日期；本测算入口仅2026年
- name: new_passenger_car
  label: 新能源乘用新车
  type: bool
  required: true
  description: 是否为包括驾驶员不超过9座的新能源乘用新车；其他车辆须税务核定
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: nev_in_current_catalog
  label: 有效减免税目录
  type: bool
  required: true
  description: 车型是否列入购置时适用的减免车辆购置税新能源汽车车型目录，不能只凭绿牌判断
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: tax_exemption_mark_verified
  label: 减免税标识已核验
  type: bool
  required: true
  description: 车辆电子信息减免税标识是否经核验；换电车还须符合换电技术要求并核验换电模式标识。未核验转人工
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: domestic_purchase_for_own_use
  label: 境内购买自用
  type: bool
  required: true
  description: 是否为境内购买自用；进口、自产、受赠等计税基础不同，转人工核定
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: battery_invoice_separate
  label: 电池单独核算开票
  type: bool
  required: true
  description: 是否为符合要求的换电车型，且电池与不含电池车身分别核算销售额并分别开具发票；是时价格不含电池
  options:
  - label: 是
    value: true
  - label: 否
    value: false
calc:
  result: dsl_helpers.changzhou_nev_purchase_tax_2026(inputs)
output:
  status: '{{ calc.result.status }}'
  final_result: '{{ calc.result.amount }}'
  reason: '{{ calc.result.reason }}'
  trace_template: '状态：{{ calc.result.status }}

    金额（元）：{{ calc.result.amount }}

    {{ calc.result.reason }}

    非审批结果，MANUAL_REVIEW/INVALID_INPUT/INELIGIBLE金额0不代表实际补贴或税款为0。

    本金额为应缴购置税；不是现金补贴。

    {% if calc.result.status == "CALCULATED" %}优惠前税额（元）：{{ calc.result.normal_tax
    }}

    减税额（元）：{{ calc.result.tax_reduction }}{% endif %}'
example_inputs:
  price_ex_vat: 200000
  purchase_date: '2026-11-21'
  new_passenger_car: true
  nev_in_current_catalog: true
  tax_exemption_mark_verified: true
  domestic_purchase_for_own_use: true
  battery_invoice_separate: false
example_expected:
  status: CALCULATED
  amount: 10000.0
limitations:
- amount为应缴车辆购置税，不是可领取现金；税款=不含税价×10%−min(不含税价×5%,15000元)。
- 2024—2025免税最高3万元已不适用于2026；2026—2027减税最高1.5万元，本规则仅开放2026年输入。
- 不查询实时车型目录或电子标识；资格须用户明确确认并由税务机关核验。
- 分位四舍五入只作金额展示；实际纳税额以税务核定为准。
