valid_period:
  start: '2026-01-01'
  end: '2026-12-31'
inputs:
- name: price
  label: 新车含税价
  type: float
  required: true
  description: 机动车销售统一发票价税合计金额，元，须大于零
- name: claim_time
  label: 申领日期
  type: string
  required: true
  description: 本规则限2026年内提交；地方跨年申请截止日期未统一，须另核，格式YYYY-MM-DD
- name: old_owned_since
  label: 旧车名下日期
  type: string
  required: true
  description: 旧车当前连续所有权登记至申请人本人名下日期，须不晚于2025-01-08；不能填写曾经持有但已转出前的历史登记日期，格式YYYY-MM-DD
- name: new_fuel
  label: 新车类型
  type: string
  required: true
  description: 目录内新能源，或排量2.0升及以下燃油乘用车
  options:
  - label: 新能源
    value: nev
  - label: 燃油
    value: fuel
- name: nev_in_catalog
  label: 新能源目录
  type: bool
  required: false
  description: 新车是否列入工信部减免车辆购置税的新能源汽车车型目录；选新能源时必填
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: displacement_liters
  label: 新车排量
  type: float
  required: false
  description: 升，燃油新车必填且须大于零、不超过2.0；新能源无需填写
- name: individual_consumer
  label: 个人消费者
  type: bool
  required: true
  description: 申请人是否为个人消费者
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: old_passenger_car
  label: 旧车为乘用车
  type: bool
  required: true
  description: 是否为公安交管登记的小型或微型载客汽车
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: new_passenger_car
  label: 新车为乘用车
  type: bool
  required: true
  description: 是否为公安交管登记的小型或微型载客汽车
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: same_owner
  label: 新旧车主一致
  type: bool
  required: true
  description: 参与补贴的旧车所有人和新购车所有人是否为同一个人消费者
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: new_owned_during_review
  label: 审核仍在名下
  type: bool
  required: true
  description: 新车是否在整个申请审核期间登记在申请人本人名下
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: same_province
  label: 新车票证同省
  type: bool
  required: true
  description: 新车发票所载主管税务机关与机动车登记机关是否在同一省级地区
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: documents_valid
  label: 完整有效凭证
  type: bool
  required: true
  description: 身份、本人境内一类银行借记卡及相应车辆原件照片/扫描件是否完整有效，尚需平台核验
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: prior_auto_claims
  label: 本年汽车已享次数
  type: int
  required: true
  description: 2026年全国汽车报废更新与置换更新合计已享次数，每人两者合计只能选1次
- name: new_invoice_date
  label: 新车发票日
  type: string
  required: true
  description: 机动车销售统一发票日期，须在2026年且不晚于申领日，格式YYYY-MM-DD
- name: new_registration_date
  label: 新车登记日
  type: string
  required: true
  description: 新车机动车登记证书注册日期，须在2026年且不晚于申领日，格式YYYY-MM-DD
- name: transfer_invoice_date
  label: 二手车发票日
  type: string
  required: true
  description: 通过售卖方式转让旧车的二手车销售统一发票日期，须在2026年，格式YYYY-MM-DD
- name: transfer_registration_date
  label: 旧车转让登记日
  type: string
  required: true
  description: 旧车机动车登记证书最近一次转让登记日期，须在2026年且不晚于申领日，格式YYYY-MM-DD
- name: invoice_city
  label: 新车开票城市
  type: string
  required: true
  description: 新车机动车销售统一发票开具地，须为常州市
- name: registration_province
  label: 新车登记省份
  type: string
  required: true
  description: 新车注册登记地，须为江苏省
- name: local_new_car_subsidy_claimed
  label: 已申报纯购补贴
  type: bool
  required: true
  description: 是否已经申报地方个人纯购新车补贴；是则需平台核查重复申领或核减，不自动叠加
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: quota_status
  label: 平台受理额度
  type: string
  required: true
  description: 按本次申请平台实时情况明确填写；未知或已耗尽转人工核验
  options:
  - label: 当前可受理
    value: available
  - label: 尚未核实
    value: unknown
  - label: 额度已用完
    value: exhausted
calc:
  result: dsl_helpers.changzhou_auto_trade_in_2026(inputs, mode='replace')
output:
  status: '{{ calc.result.status }}'
  final_result: '{{ calc.result.amount }}'
  reason: '{{ calc.result.reason }}'
  trace_template: '状态：{{ calc.result.status }}

    金额（元）：{{ calc.result.amount }}

    {{ calc.result.reason }}

    非审批结果，MANUAL_REVIEW/INVALID_INPUT/INELIGIBLE金额0不代表实际补贴或税款为0。'
example_inputs:
  price: 100000
  claim_time: '2026-11-21'
  old_owned_since: '2025-01-08'
  new_fuel: nev
  nev_in_catalog: true
  individual_consumer: true
  old_passenger_car: true
  new_passenger_car: true
  same_owner: true
  new_owned_during_review: true
  same_province: true
  documents_valid: true
  prior_auto_claims: 0
  new_invoice_date: '2026-01-01'
  new_registration_date: '2026-01-02'
  transfer_invoice_date: '2026-01-01'
  transfer_registration_date: '2026-01-02'
  invoice_city: 常州市
  registration_province: 江苏省
  local_new_car_subsidy_claimed: false
  quota_status: available
example_expected:
  status: CALCULATED
  amount: 8000.0
limitations:
- 仅依据用户明确填写的事实进行全国标准金额试算，不连接实时资格、预算、产品或车辆数据库
- 本规则只覆盖2026年内交易及申请；地方跨年受理期限、补正及资金安排另核
- 不核验证件照片真伪、实际退货/产权交易或平台记录；未知事实不得默认满足资格
- 复用全国公开规则金额函数；不是新增地方叠加补贴。
- 常州开票、江苏登记；平台额度、审核及纯购新车重复申领须实时核验。
