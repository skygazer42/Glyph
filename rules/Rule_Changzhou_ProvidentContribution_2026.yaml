valid_period:
  start: '2026-07-01'
  end: '2027-06-30'
inputs:
- name: claim_time
  label: 业务日期
  type: string
  required: true
  description: 明确业务日期，YYYY-MM-DD；不由模型推断，不改变真实申请或交易时间。
- name: monthly_salary
  label: 核定工资基数口径金额
  type: float
  required: true
  description: 普通单位职工年度调基为上年度工资总额除实际发放月数，新入职/调入须先确认口径。 单位元，有限非负数；不得以当前余额代替口径不同的月均/净余额。
- name: rate_percent
  label: 单位和个人一致缴存比例
  type: int
  required: true
  description: 5至12的整数百分比，例如12代表12%；困难企业特别审批不适用。
- name: standard_employee_confirmed
  label: 普通职工适用口径已核实
  type: bool
  required: true
  description: 已确认普通单位职工工资基数、身份和双方一致比例；灵活就业、困难企业降比/缓缴转人工。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
calc:
  result: dsl_helpers.changzhou_provident_contribution_2026(inputs)
output:
  status: '{{ calc.result.status }}'
  final_result: '{{ calc.result.amount }}'
  trace_template: '{{ calc.result.reason }}

    {% if calc.result.status == ''CALCULATED'' %}金额（元）：{{ calc.result.amount }}；性质：本次每月单位加个人缴存总额，非现金补贴{% else %}本次未给出成功金额，须补充或核实相关条件{% endif %}

    个人月缴存：{{ calc.result.get(''employee_monthly'', ''未核算'') }}

    单位月缴存：{{ calc.result.get(''employer_monthly'', ''未核算'') }}

    全年12个月不变估计：{{ calc.result.get(''annual_projection'', ''未核算'') }}'
example_inputs:
  claim_time: '2026-11-21'
  monthly_salary: 8761
  rate_percent: 12
  standard_employee_confirmed: true
example_expected:
  status: CALCULATED
  amount: 2104.0
limitations:
- 模型仅选择公式及用户明确输入的事实，不补造资格、政策身份、交易日期、余额或历史次数。
- 金额均为人民币元，计算性质见追踪；利率及后续调息、银行舍入和真实审批需以合同/中心核定为准。
