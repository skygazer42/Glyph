rule_id: Rule_Changzhou_ProvidentContribution_2026
name: 常州公积金月缴存额与工资扣款
version: '1.0'
description: 常州官方依据的金额试算；说明金额性质和适用时间，不默认资格和账户事实，实际以主管部门审核/银行合同为准。
region: 江苏省常州市
keywords:
- 公积金计算
- 公积金缴存
- 月缴存额
- 缴存计算
- 工资扣款
- 月缴存
- 缴存
- 公积金月缴存
- 缴存比例
- 缴存基数
