valid_period:
  start: '2026-09-20'
  end: null
inputs:
- name: claim_time
  label: 申请日期
  type: string
  required: true
  description: 本次业务申请日期，YYYY-MM-DD；用于判断政策施行期和自然年度。
- name: eligibility_confirmed
  label: 资格已核实
  type: bool
  required: true
  description: 仅完整事实资格已由主管部门核实时选择是；只试算金额，不查询产权/社保/审批数据库。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: unsettled_provident_loan
  label: 有未结清公贷
  type: bool
  required: true
  description: 申请时按本业务核验口径，在常州是否存在未还清的住房公积金贷款（含公转商贷款）；须据主管部门核实事实填写。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: certificate_date
  label: 权证取得日
  type: string
  required: true
  description: 申请时权证须满15年，或满6个日历月且不超过5年，YYYY-MM-DD。
- name: invoice_date
  label: 装修开票日
  type: string
  required: true
  description: 装饰装修增值税发票日期，YYYY-MM-DD；官方解读要求9月20日后开票，早于2026-09-20不支持，当日发票需另核口径。
- name: invoice_amount
  label: 核实硬装票额
  type: float
  required: true
  description: 该套住房经查验的整体硬装发票总金额，元，大于0；不含家具家电和陈设软装。
- name: available_balance
  label: 核定可提余额
  type: float
  required: true
  description: 本次本人/配偶按规定可提取的账户余额合计，元，已考虑应保留余额等约束；不是未经核实的总余额。
- name: prior_renovation_claims
  label: 本人已提次数
  type: int
  required: true
  description: 本人历史按本类装修政策办理的次数，非负整数；每人仅一套自住住房一次。
- name: home_withdrawn_amount
  label: 同套已提金额
  type: float
  required: true
  description: 同套住房所有提取人此前装修提取额合计，元；本次扣除后共同受发票金额及10万元上限约束。
- name: hard_decoration_invoice
  label: 整体硬装发票
  type: bool
  required: true
  description: 是否为真实多空间多工种整体硬装的装饰装修增值税发票，且已核实真实合同和票面信息。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: nonowner_spouse_premarital_home
  label: 婚前房非产权配偶
  type: bool
  required: true
  description: 申请人是否为婚前所购住房中未列在权证上的配偶；是则不可按本政策办理装修提取。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
calc:
  result: dsl_helpers.changzhou_renovation_2026(inputs)
output:
  status: '{{ calc.result.status }}'
  final_result: '{{ calc.result.amount }}'
  reason: '{{ calc.result.reason }}'
  trace_template: '{{ calc.result.reason }}'
example_inputs:
  claim_time: '2026-11-21'
  certificate_date: '2026-05-21'
  invoice_date: '2026-10-01'
  invoice_amount: 120000
  available_balance: 200000
  eligibility_confirmed: true
  unsettled_provident_loan: false
  prior_renovation_claims: 0
  home_withdrawn_amount: 0
  hard_decoration_invoice: true
  nonowner_spouse_premarital_home: false
example_expected:
  status: CALCULATED
  amount: 100000.0
expected_amount: 100000.0
limitations:
- 只对明确已核实资格的事实试算，不代表审批、实时余额或房源库核验。
- 金额单位元，按分向下取整仅为保守展示，不宣称官方统一舍入规则。
- 真实硬装发票及同套所有提取人10万元上限；没有面积定额、十年再提或两次额度。
- 权证满6个月至5年或满15年；本人仅名下一套一次；无未清公积金/公转商贷款。
- 9月20日当日发票的“实施日后”受理口径转人工核实。
