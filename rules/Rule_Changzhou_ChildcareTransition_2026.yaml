valid_period:
  start: '2026-01-01'
  end: '2026-12-31'
inputs:
- name: claim_time
  label: 申请日期
  type: string
  required: true
  description: 实际本次申请日期，YYYY-MM-DD；不能以计算日期替代历史申请日期。
- name: birth_date
  label: 婴幼儿出生日期
  type: string
  required: true
  description: 出生医学证明日期YYYY-MM-DD；特殊死亡、收养跨年度情形需主管部门复核。
- name: eligibility_confirmed
  label: 申领资格已核实
  type: bool
  required: true
  description: 主管部门已核实完整资格、材料及监护/困难身份等；不得默认是，试算不代替审核。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: changzhou_household_confirmed
  label: 常州户籍已核实
  type: bool
  required: true
  description: 孩子户籍登记在常州，由户籍地受理，不凭父母工作地或居住地认定。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: chinese_nationality_confirmed
  label: 中国国籍已核实
  type: bool
  required: true
  description: 补贴对象须具有中华人民共和国国籍。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: already_received
  label: 本项已经领取
  type: bool
  required: true
  description: 育儿填归属2026年度这一次是否已领；求职填此前任何学段是否已享受该一次性补贴。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: annual_entitlement_confirmed
  label: 2026年度资格已核实
  type: bool
  required: true
  description: 须经办部门确认本次补贴归属2026年度，首次与续领资格有效；不自动追补2025年金额。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
calc:
  result: dsl_helpers.changzhou_childcare_transition_2026(inputs)
output:
  status: '{{ calc.result.status }}'
  final_result: '{{ calc.result.amount }}'
  reason: '{{ calc.result.reason }}'
  trace_template: '{{ calc.result.reason }}'
example_inputs:
  claim_time: '2026-11-21'
  birth_date: '2023-06-30'
  eligibility_confirmed: true
  changzhou_household_confirmed: true
  chinese_nationality_confirmed: true
  already_received: false
  annual_entitlement_confirmed: true
example_expected:
  status: CALCULATED
  amount: 1800.0
expected_amount: 1800.0
limitations:
- 金额单位元；只计算单个申请对象本次金额，不查询社保、学籍、户籍、历史发放或审批数据库。
- 不得将两类育儿规则相加，同一孩子同一归属年度不重复；月数折算不代表按月打款。
- 对照表来源为锡林郭勒盟官方转载国家卫健委全国标准，不使用其地方政策；常州适用性由本目录常州2026新闻发布会正文交叉确认。
