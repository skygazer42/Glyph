rule_id: Rule_Changzhou_ChildcareTransition_2026
name: 常州2026年度育儿补贴（2023至2024年出生）
version: '1.0'
description: 官方公开标准的条件试算，未核实资格不得默认满足；CALCULATED不代表审批或到账。人才最高标准仅供参考，amount为0表示待核验，不表示没有补贴。
region: 江苏省常州市
keywords:
- 育儿补贴按月折算
- 2023出生2026补贴
