rule_id: Rule_Changzhou_TalentSupport_2026
name: 常州人才生活租房及专属房票最高标准核验
version: '1.0'
description: 官方公开标准的条件试算，未核实资格不得默认满足；CALCULATED不代表审批或到账。人才最高标准仅供参考，amount为0表示待核验，不表示没有补贴。
region: 江苏省常州市
keywords:
- 人才生活居住双资助
- 人才房票
- 人才专属房票
- 人才购房补贴
- 人才租房补贴
- 人才生活补贴
- 青年人才生活居住双资助
- 生活居住双资助
- 龙城英才2026
policy_source:
  title: 关于推进高能级创新型城市建设的若干措施
  url: https://www.changzhou.gov.cn/gi_news/575178824994368
  document_number: 常委科发〔2026〕5号
  raw_path: resources/data/raw/changzhou_finance_20261121/benefits/talent.web.json
  body_sha256: ecb6c82db357cbfed7fa9a9351b21e06c54a310bca6e18dab4d9dec9f9517f84
  published_date: '2026-09-01'
  issued_date: null
  completeness: official_published_text
  raw_format: official_page_web_provider_json
  source_path: resources/data/process/changzhou_finance_20261121/benefits/talent.md
  clause: 第五部分第12项及文末有效期
  supporting_sources:
  - title: 坚持“投资于人”——“龙城英才计划”再优化
    url: https://zg.changzhou.gov.cn/html/czzg/2026/CIBKBPQB_0528/59915.html
