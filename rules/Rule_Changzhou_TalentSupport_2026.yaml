valid_period:
  start: '2026-10-01'
  end: '2030-12-31'
inputs:
- name: claim_time
  label: 申请日期
  type: string
  required: true
  description: 实际本次申请日期，YYYY-MM-DD；不能以计算日期替代历史申请日期。
- name: support_kind
  label: 人才支持类型
  type: string
  required: true
  description: 仅展示正式措施最高标准；个人应得金额须查现行细则、主管部门认定及新旧衔接。
  options:
  - label: 生活与租房合计最高标准
    value: living_rent
  - label: 人才专属房票最高标准
    value: housing_voucher
calc:
  result: dsl_helpers.changzhou_talent_support_2026(inputs)
output:
  status: '{{ calc.result.status }}'
  final_result: '{{ calc.result.amount }}'
  reason: '{{ calc.result.reason }}'
  trace_template: '{{ calc.result.reason }}'
example_inputs:
  claim_time: '2026-11-21'
  support_kind: housing_voucher
example_expected:
  status: MANUAL_REVIEW
  amount: 0.0
expected_amount: 0.0
limitations:
- 金额单位元；只计算单个申请对象本次金额，不查询社保、学籍、户籍、历史发放或审批数据库。
- 人才最高标准不等于个人应得金额；求职多种困难身份不叠加。
- 2026年5月官方已说明优化范围和周期；未核实现行学历档位，不套用旧版10/5/3万、30/8/5万或旧三年周期，不承诺废止衔接日期。
