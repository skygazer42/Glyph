inputs:
- name: price
  label: 新车销售价格
  type: float
  required: true
  description: 元，扣除商家优惠后的最终销售价格；本入口不以该价格套用旧年补贴比例
- name: purchase_date
  label: 购买日期
  type: string
  required: true
  description: YYYY-MM-DD，仅核验2026购车请求；活动有效期尚未取得正式金额细则
calc:
  result: dsl_helpers.changzhou_electric_bicycle_2026(inputs)
output:
  status: '{{ calc.result.status }}'
  final_result: '{{ calc.result.amount }}'
  reason: '{{ calc.result.reason }}'
  trace_template: '状态：{{ calc.result.status }}

    金额尚未确定，须核实本期正式金额标准及活动期限。

