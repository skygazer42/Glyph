limitations:
- 这是缺少有效金额依据时的人工核验入口，不列为已实现现金金额计算。
- 2026官方问答只列部分条件，未列金额或活动期；不能迁移2025年30%最高1000元。
- valid_period仅为本入口接受的请求年份，不代表已确认补贴活动覆盖全年。
