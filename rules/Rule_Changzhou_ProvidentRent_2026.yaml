valid_period:
  start: '2026-01-01'
  end: '2026-12-31'
inputs:
- name: claim_time
  label: 业务日期
  type: string
  required: true
  description: 明确业务日期，YYYY-MM-DD；不由模型推断，不改变真实申请或交易时间。
- name: eligibility_confirmed
  label: 相关事实已核实
  type: bool
  required: true
  description: 仅用户明确核实该场景全部资格、真实材料、历史记录及账户事实时填是；未知填否转人工核实。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: multi_child_eligible
  label: 多孩提高限额资格已核实
  type: bool
  required: true
  description: 按官方生育时间和抚养权材料认定，不能只按家庭儿童数量推断；普通15000元/年，多孩18000元/年。
  options:
  - label: 是
    value: true
  - label: 否
    value: false
- name: available_withdrawable_balance
  label: 本人可提净余额
  type: float
  required: true
  description: 已扣应保留余额且符合租房材料条件的本人可提净余额，配偶单独核算。 单位元，有限非负数；不得以当前余额代替口径不同的月均/净余额。
- name: withdrawn_this_year
  label: 本人自然年已提租房款
  type: float
  required: true
  description: 包含本年度全部租房提取，按自然年累计，未提填0。 单位元，有限非负数；不得以当前余额代替口径不同的月均/净余额。
calc:
  result: dsl_helpers.changzhou_provident_rent_2026(inputs)
output:
  status: '{{ calc.result.status }}'
  final_result: '{{ calc.result.amount }}'
  trace_template: '{{ calc.result.reason }}

    {% if calc.result.status == ''CALCULATED'' %}金额（元）：{{ calc.result.amount }}；性质：本人本自然年度剩余租房提取额{% else %}本次未给出成功金额，须补充或核实相关条件{% endif %}'
example_inputs:
  claim_time: '2026-11-21'
  eligibility_confirmed: true
  multi_child_eligible: true
  available_withdrawable_balance: 20000
  withdrawn_this_year: 5000
example_expected:
  status: CALCULATED
  amount: 13000.0
limitations:
- 模型仅选择公式及用户明确输入的事实，不补造资格、政策身份、交易日期、余额或历史次数。
- 金额均为人民币元，计算性质见追踪；利率及后续调息、银行舍入和真实审批需以合同/中心核定为准。
