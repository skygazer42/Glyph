rule_id: Rule_Changzhou_ProvidentRent_2026
name: 常州个人租房公积金可提额度
version: '1.0'
description: 常州官方依据的金额试算；说明金额性质和适用时间，不默认资格和账户事实，实际以主管部门审核/银行合同为准。
region: 江苏省常州市
keywords:
- 租房公积金
- 租房提取
- 租房能提多少
- 房租提取
- 公积金租房
- 房租公积金
policy_source:
  title: 关于调整我市提取住房公积金支付房租政策的通知
  url: https://www.changzhou.gov.cn/gi_news/255168800394712
  raw_path: resources/data/raw/changzhou_finance_20261121/provident/batch3.web.json
