  published_date: '2023-06-29'
  issued_date: '2023-06-21'
  completeness: official_published_text
  source_path: resources/data/process/changzhou_finance_20261121/provident/08.md
  clause: 见原文及supporting_sources中的额度、期限、利率、限额和舍入条款
  supporting_sources:
